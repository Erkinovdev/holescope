<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Holescope — разбор поездки</title>
<style>
:root{--bg:#0b0d12;--surf:#151922;--raised:#1d222d;--line:#2a3040;--text:#f2f4f8;--muted:#8f99ab;--amber:#ffb020;--red:#ff5d5d;--green:#3ecf8e;--blue:#4da3ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 Inter,system-ui,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:16px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:18px;margin:0;letter-spacing:-.02em}h1 b{color:var(--amber)}
.prog{color:var(--muted);font-size:14px}.bar{height:6px;background:var(--raised);border-radius:3px;width:200px;overflow:hidden}.bar i{display:block;height:100%;background:var(--amber)}
main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;padding:20px 24px;max-width:1300px;margin:auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:16px}
canvas{width:100%;display:block;border-radius:12px;background:var(--bg)}
.info{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.chip{background:var(--raised);border-radius:999px;padding:5px 12px;font-size:13px}.chip b{color:var(--amber)}
.tag{color:var(--bg);background:var(--amber);font-weight:700}
.btns{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
button{font:inherit;color:var(--text);background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;text-align:left}
button:hover{border-color:var(--amber)}button.on{border-color:var(--amber);background:#3a2c0f}
button kbd{background:var(--bg);border-radius:6px;padding:1px 7px;margin-right:8px;color:var(--muted)}
.nav{display:flex;gap:8px;margin-top:12px}.nav button{flex:1;text-align:center}
.small{color:var(--muted);font-size:13px}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
a.dl{display:inline-block;margin-left:auto;background:var(--amber);color:#0b0d12;font-weight:700;padding:10px 16px;border-radius:12px;text-decoration:none}
</style></head><body>
<header><h1>Hole<b>scope</b> · разбор поездки</h1><span class="prog" id="prog"></span><div class="bar"><i id="barfill"></i></div>

<main>
<section class="card"><canvas id="wave" width="900" height="300"></canvas>
<div class="info" id="info"></div>
<div class="btns" id="btns"></div>
<div class="nav"><button id="prev">← Назад</button><button id="skip">Пропустить (пробел)</button><button id="next">Вперёд →</button></div>
<p class="small">Клавиши: 1–8 — выбрать метку, 0 — снять, ← → — листать, пробел — следующий без метки. Разметка сохраняется в браузере автоматически.</p></section>
<section class="card"><canvas id="map" width="560" height="560"></canvas>
<div class="legend" id="legend"></div>
<p class="small" id="mapnote"></p></section>
</main>

function setLabel(l){const e=E[idx];if(!e)return;if(l==null)delete labels[e.id];else labels[e.id]={label:l};save();if(l!=null&&idx<E.length-1)idx++;render()}
const go=d=>{idx=Math.max(0,Math.min(E.length-1,idx+d));render()};
$("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);
const nextFree=()=>{for(let k=1;k<=E.length;k++){const j=(idx+k)%E.length;if(!labels[E[j].id]){idx=j;break}}render()};
$("skip").onclick=nextFree;
addEventListener("keydown",ev=>{if(ev.key==="ArrowRight")go(1);else if(ev.key==="ArrowLeft")go(-1);else if(ev.key===" "){ev.preventDefault();nextFree()}else if(ev.key==="0")setLabel(null);else{const l=LAB.find(x=>x[2]===ev.key);if(l)setLabel(l[0])}});
$("dl").onclick=ev=>{ev.preventDefault();const out={file:D.file,created:new Date().toISOString(),labels:E.filter(e=>labels[e.id]).map(e=>({id:e.id,label:labels[e.id].label,t:e.t,lat:e.lat,lon:e.lon,speed:e.speed,peak:e.peak,noise:e.noise,ratio:e.ratio,dur:e.dur,pair:e.pair,first:e.first,energy:e.energy,pos:e.pos,neg:e.neg,src:e.src,mark:e.mark}))};
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:"application/json"}));a.download="labels_"+D.file.replace(/\.csv$/,"")+".json";a.click()};

mc.onclick=ev=>{const r=mc.getBoundingClientRect(),x=(ev.clientX-r.left)*mc.width/r.width,y=(ev.clientY-r.top)*mc.height/r.height;let best=-1,bd=1e9;E.forEach((e,i)=>{const q=px(e.lat,e.lon),d=(q[0]-x)**2+(q[1]-y)**2;if(d<bd){bd=d;best=i}});if(best>=0&&bd<900){idx=best;render()}};
render();
