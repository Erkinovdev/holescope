server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 60m;

  # воркер карты (.mjs) должен идти как JavaScript, иначе браузер не запустит модульный воркер
  include /etc/nginx/mime.types;
  types { application/javascript mjs; }

  # API и загруженные файлы — на Django (сервис web в docker-compose)
  location /api/ { proxy_pass http://web:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 300s; }
  location /django-admin/ { proxy_pass http://web:8000/admin/; proxy_set_header Host $host; }
  location /static/ { proxy_pass http://web:8000; }

  # SPA: любые пути отдают index.html
  location / { try_files $uri /index.html; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
}
