# PostGIS-образ: геометрию в моделях пока не используем (lat/lon + индексы), но БД сразу готова к миграции на PostGIS.
services:
  db:
    image: ${DB_IMAGE:-postgis/postgis:16-3.4}
    environment:
      POSTGRES_DB: ${PG_NAME:-holescope}
      POSTGRES_USER: ${PG_USER:-holescope}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?задайте PG_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-holescope} -d ${PG_NAME:-holescope}"]
      interval: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      PG_HOST: db
      PG_NAME: ${PG_NAME:-holescope}
      PG_USER: ${PG_USER:-holescope}
      STT_URL: ${STT_URL:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - media:/app/media
      - ./data:/app/data
      - ../analysis:/analysis:ro

  # Ночные задачи «мозга»: заделанные ямы, калибровка, подвеска, обучение, снимок, награды (раз в сутки)
  worker:
    build: .
    env_file: .env
    environment:
      PG_HOST: db
      PG_NAME: ${PG_NAME:-holescope}
      PG_USER: ${PG_USER:-holescope}
    depends_on:
      web:
        condition: service_started
    volumes:
      - media:/app/media
      - ./data:/app/data
      - ../analysis:/analysis:ro
    command: ["sh", "-c", "sleep 120; while true; do python manage.py nightly; sleep 86400; done"]

  # Админка (Vite+React, статика в nginx; /api проксируется на web)
  admin:
    build: ../admin-web
    depends_on:
      - web
    ports:
      - "${ADMIN_PORT:-8020}:80"

  # Распознавание речи Холи на сервере (Whisper). Внутренний сервис, наружу не открыт. Включается: COMPOSE_PROFILES=prod,stt и STT_URL=http://stt:9000
  stt:
    build:
      context: ./stt
      args:
        STT_MODEL: ${STT_MODEL:-base}
    profiles: ["stt"]
    restart: unless-stopped
    mem_limit: 1500m

  # HTTPS (Let's Encrypt) перед админкой и API; включается только на сервере: COMPOSE_PROFILES=prod, DOMAIN=...
  caddy:
    image: caddy:2
    profiles: ["prod"]
    restart: unless-stopped
    depends_on:
      - admin
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../webapp:/srv/app:ro
      - caddy_data:/data

volumes:
  caddy_data:
  pgdata:
  media:
