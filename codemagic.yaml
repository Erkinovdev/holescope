workflows:
  android-apk:
    name: Android APK
    instance_type: linux_x2
    max_build_duration: 40
    working_directory: app
    environment:
      flutter: stable
      java: 17
      vars:
        API_BASE: "https://holescop.duckdns.org"
    scripts:
      - name: Зависимости
        script: flutter pub get
      - name: Сборка APK
        script: flutter build apk --release --dart-define=API_BASE=$API_BASE
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - abdukkhak1mov@gmail.com

  ios-ipa:
    name: iOS IPA (без подписи, для Sideloadly)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: app
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        API_BASE: "https://holescop.duckdns.org"
    scripts:
      - name: Зависимости
        script: flutter pub get
      - name: Pods
        script: find . -name Podfile -execdir pod install \;
      - name: Сборка без подписи
        script: flutter build ios --release --no-codesign --dart-define=API_BASE=$API_BASE
      - name: Упаковка в IPA
        script: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          (cd build/ios/ipa && zip -qry holescope.ipa Payload && rm -rf Payload)
    artifacts:
      - build/ios/ipa/holescope.ipa

  ios-appstore:
    name: iOS App Store Connect (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: app
    integrations:
      app_store_connect: Holescope
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: uz.holescope.holescope.PTMARNJ497
      vars:
        API_BASE: "https://holescop.duckdns.org"
        APP_STORE_APPLE_ID: 6824828599
    scripts:
      - name: Зависимости
        script: flutter pub get
      - name: Pods
        script: find . -name Podfile -execdir pod install \;
      - name: Подпись
        script: xcode-project use-profiles
      - name: Номер сборки
        script: |
          LAST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          echo "BUILD_NUM=$((LAST + 1))" >> $CM_ENV
      - name: Сборка IPA
        script: flutter build ipa --release --build-number=$BUILD_NUM --export-options-plist=/Users/builder/export_options.plist --dart-define=API_BASE=$API_BASE
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - abdukkhak1mov@gmail.com
