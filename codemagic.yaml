workflows:
  android-apk:
    name: Android APK
    instance_type: linux_x2
    max_build_duration: 40
    working_directory: app
    environment:
      flutter: stable
      java: 17
      vars:
        API_BASE: "http://95.217.220.168"
    scripts:
      - name: Зависимости
        script: flutter pub get
      - name: Сборка APK
        script: flutter build apk --release --dart-define=API_BASE=$API_BASE
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - abdukkhak1mov@gmail.com

  ios-ipa:
    name: iOS IPA (без подписи, для Sideloadly)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: app
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        API_BASE: "http://95.217.220.168"
    scripts:
      - name: Зависимости
        script: flutter pub get
      - name: Pods
        script: find . -name Podfile -execdir pod install \;
      - name: Сборка без подписи
        script: flutter build ios --release --no-codesign --dart-define=API_BASE=$API_BASE
      - name: Упаковка в IPA
        script: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          (cd build/ios/ipa && zip -qry holescope.ipa Payload && rm -rf Payload)
    artifacts:
      - build/ios/ipa/holescope.ipa
